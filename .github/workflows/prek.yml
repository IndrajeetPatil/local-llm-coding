name: prek

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: prek hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A hook that rewrites a file fails the step.
      - name: Run prek hooks
        uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: latest-known
          extra-args: --all-files --stage pre-commit
        env:
          # security.yml scans the complete history with Gitleaks and audits
          # the workflows with zizmor. no-commit-to-branch guards local commits
          # only, so CI never fails on main if this workflow gains a push trigger.
          SKIP: gitleaks,zizmor,no-commit-to-branch
