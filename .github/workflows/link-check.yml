name: Link Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    name: Check link rot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # lychee reads lychee.toml. --include-fragments fails links whose
      # #anchor no longer exists, and --require-https fails http:// links
      # whose site also serves HTTPS; by default lychee passes both.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --verbose --no-progress
            --include-fragments --require-https
            './**/*.md' './**/*.html' './**/*.txt'
