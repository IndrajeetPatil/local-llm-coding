minimum_prek_version = "0.5.11"
default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]
default_stages = ["pre-commit"]

# `prek update` records each hook's commit SHA with a `# frozen: vX.Y.Z` tag.
[update]
freeze = true
cooldown_days = 0

[[repos]]
repo = "meta"

[[repos.hooks]]
id = "check-hooks-apply"

[[repos.hooks]]
id = "check-useless-excludes"

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca" # frozen: v1.7.12

[[repos.hooks]]
id = "actionlint"

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "06a39750ec31860bb44f2acf67182c40016cd1e7" # frozen: v1.32.0

# Matches the pedantic audit in security.yml.
[[repos.hooks]]
id = "zizmor"
args = ["--pedantic"]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8" # frozen: v4.5.0

# The same types and strict mode as conventional-commits.yml; strict mode
# also rejects fixup! and merge commit messages.
[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = [
  "--strict",
  "--verbose",
  "build",
  "chore",
  "ci",
  "docs",
  "feat",
  "fix",
  "perf",
  "refactor",
  "revert",
  "style",
  "test",
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e" # frozen: v8.30.1

# Scans the staged diff; security.yml scans the complete history.
[[repos.hooks]]
id = "gitleaks"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "forbid-submodules"
name = "forbid submodules"
entry = "submodules are not allowed in this repository:"
language = "fail"
types = ["directory"]

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

[[repos.hooks]]
id = "check-added-large-files"
args = ["--enforce-all"]

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "fix-byte-order-marker"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-illegal-windows-names"

[[repos.hooks]]
id = "destroyed-symlinks"

[[repos.hooks]]
id = "check-shebang-scripts-are-executable"

[[repos.hooks]]
id = "check-vcs-permalinks"

[[repos.hooks]]
id = "no-commit-to-branch"
args = ["--branch=main"]
